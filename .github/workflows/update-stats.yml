name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 UTC.
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Markdown parser
        run: python -m pip install -r requirements.txt
      - name: Update profile stats and generated pages
        run: python scripts/update_stats.py
      - name: Commit changes
        run: |
          if git diff --quiet -- profile-stats.json index.html index.md; then
            echo "No stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats.json index.html index.md
          git commit -m "Update profile stats"
          git push
